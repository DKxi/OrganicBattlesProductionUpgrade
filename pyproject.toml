[project]
name = "organicbattlesv4p"
version = "1.0.0"

description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pip>=26.0",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pytest==8.3.4",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
    "tomli==2.0.1",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.12.0",
    "redis>=5.0.0",
    "slowapi>=0.1.9",
    "eval_type_backport",
    "boto3>=1.43.93",
    "gunicorn>=23.0.0",
]

[tool.pytest.ini_options]
markers = [
    "e2e: End-to-end browser and UI tests",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    "__pycache__",
    "migrations/versions",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length > 120 (handled for long SQL / schema strings)
    "E402",  # module import not at top of file (needed for scripts sys.path inserts)
    "W291",  # trailing whitespace
    "W293",  # blank line contains whitespace
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"app.py" = ["F401"]
"app/api/deps.py" = ["F401"]
"migrations/*" = ["F401"]
"scripts/*" = ["E402", "F401"]
"tests/**" = ["F841", "E702", "F401", "F541"]
