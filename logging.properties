[loggers]
keys = root,organicbattles,api,battle,auth,database,content,game

[handlers]
keys = consoleHandler,fileHandler

[formatters]
keys = standardFormatter,detailedFormatter

[logger_root]
level = INFO
handlers = consoleHandler,fileHandler

[logger_organicbattles]
level = INFO
handlers = consoleHandler,fileHandler
qualname = organicbattles
propagate = 0

[logger_api]
level = INFO
handlers = consoleHandler,fileHandler
qualname = organicbattles.api
propagate = 0

[logger_battle]
level = INFO
handlers = consoleHandler,fileHandler
qualname = organicbattles.battle
propagate = 0

[logger_auth]
level = INFO
handlers = consoleHandler,fileHandler
qualname = organicbattles.auth
propagate = 0

[logger_database]
level = INFO
handlers = consoleHandler,fileHandler
qualname = organicbattles.database
propagate = 0

[logger_content]
level = INFO
handlers = consoleHandler,fileHandler
qualname = organicbattles.content
propagate = 0

[logger_game]
level = INFO
handlers = consoleHandler,fileHandler
qualname = organicbattles.game
propagate = 0

[handler_consoleHandler]
class = StreamHandler
level = DEBUG
formatter = standardFormatter
args = (sys.stdout,)

[handler_fileHandler]
class = handlers.RotatingFileHandler
level = DEBUG
formatter = detailedFormatter
args = ('logs/organic_battles.log', 'a', 10485760, 5, 'utf-8')

[formatter_standardFormatter]
format = %(asctime)s [%(levelname)s] [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S

[formatter_detailedFormatter]
format = %(asctime)s [%(levelname)s] [%(name)s] [pid:%(process)d] %(message)s
datefmt = %Y-%m-%d %H:%M:%S

